name: Test formula
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@7001732169813b7bd296f39014e60fcc07f0ef9a
      - name: Use the checked-out formula
        run: |
          brew tap backmatter/tap
          cp Formula/tex-ls.rb "$(brew --repository backmatter/tap)/Formula/tex-ls.rb"
      - run: brew install backmatter/tap/tex-ls
      - run: brew test backmatter/tap/tex-ls
